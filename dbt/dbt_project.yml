# dbt Project Configuration
# This file configures the dbt project for the cryptocurrency ETL pipeline

name: 'crypto_etl'
version: '1.0.0'
config-version: 2

# Profile to use (defined in profiles.yml)
profile: 'crypto_etl'

# Model directories
model-paths: ["models"]
test-paths: ["tests"]

# Installed outside the project dir so the bind mount cannot hide the packages
# that were vendored into the image at build time.
packages-install-path: "/opt/dbt/dbt_packages"

clean-targets:
  - "target"
  - "dbt_packages"

# Model configuration
# All models build into the connection schema (public). dbt is the single owner
# of the star schema, so the tables keep the names existing consumers expect
# (docs/analysis_queries.sql, the pipeline_runs foreign keys).
models:
  crypto_etl:
    # Staging models - raw data cleaned
    staging:
      +materialized: view
    
    # Dimension models - reference data
    dimensions:
      +materialized: table
    
    # Fact models - transaction data
    facts:
      +materialized: table
